<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laser Ride: Lol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 42px;
        }

        p {
            color: #b8bcc7;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        a {
            display: block;
            padding: 16px 20px;
            border-radius: 10px;
            background: #252936;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

            a:hover {
                background: #343847;
                transform: translateY(-2px);
            }

        footer {
            margin-top: 40px;
            color: #777c88;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Laser Ride: Lol</h1>

        <p>Welcome to Laser Ride: Lol.</p>

        <div class="links">
            <a href="https://laserride.github.io/Privacy_Policy/">
                Privacy Policy
            </a>

            <a href="https://laserride.github.io/Terms_Of_Service/">
                Terms of Service
            </a>
        </div>

        <footer>
            &copy; 2026 Laser Ride: Lol. All rights reserved.
        </footer>

    </main>

</body>
</html>
